# =============================================================================
# neocarta coverage baseline — machine-readable threshold source
# =============================================================================
# The GUIDE §4 "no coverage / test-count regression" invariant is relative
# ("never lower coverage / never drop a test"). This file is the committed
# reference point that invariant ratchets against, and the artifact the
# enforcing CI gate (landing in #290 — the coverage job is report-only today)
# loads and compares a fresh coverage.xml / collected test count against.
#
# See docs/testing/coverage-baseline.md for the narrative, reproduce steps, and
# the full #290 consumption contract. Generated by S0.2 (#288).
#
# FLOOR POLICY: a *_floor is the measured value truncated DOWN to a whole
# percent, giving up to ~1pp of headroom so branch-count jitter can't flake the
# gate. Compare a fresh run's package line-rate/branch-rate against the floor,
# NOT the measured value. NEVER hand-lower a floor; raise floors (ratchet up)
# only after a genuine, sustained coverage gain. Percentages are 0.00–100.00
# (coverage.py precision = 2).

[meta]
tool = "coverage.py"
tool_version = "7.15.2"          # keep in sync with the installed coverage
generated_by = "make test-cov"   # pytest tests/unit, --ignore _mcp/_cli/agent, --cov=neocarta
branch = true                    # [tool.coverage.run] branch = true — floors cover BOTH line & branch
source = "neocarta"
report_format = "coverage.xml (Cobertura)"
# The package key "root" below maps to the Cobertura package name "." — the loose
# neocarta/*.py modules (__init__, _logging, enums, errors, warnings).

[test_count]
# GUIDE §4 also forbids dropping tests. Authoritative `pytest --collect-only -q` counts.
# Re-baselined against `main` for the 0.8.1 safety net: the 0.9.x normalization stack (and
# its ~50 tests) is not present on this branch, so these counts sit below an EKL-tree run.
# Only `all` is enforced by the gate — the others are reference.
# Ratcheted up by each PR's own delta, which keeps that main-vs-branch margin intact
# rather than silently absorbing another branch's tests into the floor:
#   S1.3 (#294) +59 unit / +14 integration — the merge-contract tests.
gated_unit = 937    # `make test-cov` scope (tests/unit minus _mcp/_cli/agent) — pairs with [packages.*] below
all_unit = 1181     # full tests/unit (includes _mcp/_cli/agent)
all = 1291          # tests/ (unit + integration + smoke)

[total]
line_measured = 68.53
line_floor = 68
branch_measured = 49.30
branch_floor = 49

# --- Enforceable per-package floors (packages the `make test-cov` scope exercises) ---

[packages.connectors]
line_measured = 78.45
line_floor = 78
branch_measured = 60.41
branch_floor = 60

# data_model branch is lower here than on the EKL tree: the normalization stack's
# 100%-covered `data_model/normalized/*` subpackage (a 0.9.x-band addition) is not on
# this branch, so the aggregate reflects only main's data_model. This is a re-baseline
# to actual behavior, not a hand-lowered floor.
[packages.data_model]
line_measured = 99.66
line_floor = 99
branch_measured = 83.33
branch_floor = 83

[packages.enrichment]
line_measured = 79.57
line_floor = 79
branch_measured = 63.64
branch_floor = 63

[packages.ingest]
# Measured refreshed by S1.3 (#294), which added ingest merge-contract unit tests:
# line 65.44 -> 67.73, branch 37.23 -> 43.14. Floors are deliberately NOT ratcheted in the
# same PR: the policy raises floors after a *sustained* gain, and trunc(43.14) = 43 would
# leave 0.14pp of headroom, the zero-margin fragility that turned the #290 gate red before.
# Ratchet to 67 / 43 once these numbers hold across a few PRs.
line_measured = 67.73
line_floor = 65
branch_measured = 43.14
branch_floor = 37

[packages.root]
line_measured = 95.5
line_floor = 95
branch_measured = 86.84
branch_floor = 86

# --- Informational only — measured by SEPARATE suites, NOT gated by `make test-cov`. ---
# Under the `make test-cov` scope these two packages read as scope artifacts (their test
# suites are ignored): _mcp = 0.00 line / 0.00 branch, _cli = 41.70 line / 0.00 branch.
# Those are NOT real coverage. The honest numbers below come from the dedicated suites the
# CI `test-mcp` / `test-cli` jobs run. A #290 gate driven by a `make test-cov` coverage.xml
# MUST NOT compare against these (see coverage-baseline.md → Scope caveat).

[informational._mcp]
line_measured = 55.32
branch_measured = 25.0
gated_by = "make test-mcp"
measured_by = "pytest tests/unit/_mcp --cov=neocarta._mcp"
note = "unit tests only (22 collected); tests/integration/_mcp needs Docker and is excluded here, so true coverage is higher"

[informational._cli]
line_measured = 91.82
branch_measured = 73.14
gated_by = "make test-cli"
measured_by = "pytest tests/unit/_cli --cov=neocarta._cli"
note = "217 unit tests, all passing in a clean env"
