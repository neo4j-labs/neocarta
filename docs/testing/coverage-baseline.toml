# --- Informational only — measured by SEPARATE suites, NOT gated by `make test-cov`. ---
# Under the `make test-cov` scope these two packages read as scope artifacts (their test
# suites are ignored): _mcp = 0.00 line / 0.00 branch, _cli = 41.70 line / 0.00 branch.
# Those are NOT real coverage. The honest numbers below come from the dedicated suites the
# CI `test-mcp` / `test-cli` jobs run. A #290 gate driven by a `make test-cov` coverage.xml
# MUST NOT compare against these (see coverage-baseline.md → Scope caveat).

[informational._mcp]
line_measured = 55.32
branch_measured = 25.0
gated_by = "make test-mcp"
measured_by = "pytest tests/unit/_mcp --cov=neocarta._mcp"
note = "unit tests only (22 collected); tests/integration/_mcp needs Docker and is excluded here, so true coverage is higher"

[informational._cli]
line_measured = 91.82
branch_measured = 73.14
gated_by = "make test-cli"
measured_by = "pytest tests/unit/_cli --cov=neocarta._cli"
note = "217 unit tests, all passing in a clean env"
