# Ruff config for the dbxcarta subtree.
#
# This is intentionally minimal: it inherits the entire repo-standard ruff config
# (select = ["ALL"], the ignore list, per-file-ignores, naming, pydocstyle) from
# the neocarta root via `extend`, and overrides only `target-version`.
#
# The dbxcarta packages declare requires-python >=3.12 and use 3.12-only syntax
# (PEP 695 type parameters, e.g. `def f[T](...)`). Ruff has a single global
# target-version per config resolution, and the root infers 3.10 from neocarta's
# published requires-python — which would (a) reject the PEP 695 syntax as a
# parse error here and (b) suppress neocarta's own 3.10-compat lints if bumped
# globally. Scoping the 3.12 target to this subtree resolves both without
# disturbing neocarta's linting.
extend = "../pyproject.toml"
target-version = "py312"
