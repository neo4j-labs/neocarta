  metrics:
  - name: total_arr_usd
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN subscriptions.status = 'active' THEN subscriptions.arr_usd
          ELSE 0 END)
    description: Annual recurring revenue across all active subscriptions, USD.
    ai_context:
      synonyms:
      - ARR
      - annual recurring revenue
      - annualized recurring revenue
  - name: total_mrr_usd
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN subscriptions.status = 'active' THEN subscriptions.mrr_usd
          ELSE 0 END)
    description: Monthly recurring revenue across all active subscriptions, USD.
    ai_context:
      synonyms:
      - MRR
      - monthly recurring revenue
  - name: pipeline_amount_usd
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN opportunities.stage NOT IN ('closed_won','closed_lost')
          THEN opportunities.amount_usd ELSE 0 END)
    description: Open pipeline value (opportunities not yet closed), USD.
    ai_context:
      synonyms:
      - open pipeline
      - deal pipeline
  - name: weighted_pipeline_usd
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN opportunities.stage NOT IN ('closed_won','closed_lost')
          THEN opportunities.amount_usd * opportunities.probability ELSE 0 END)
    description: Probability-weighted pipeline value, USD.
  - name: won_revenue_usd
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN opportunities.stage = 'closed_won' THEN opportunities.amount_usd
          ELSE 0 END)
    description: Closed-won opportunity revenue, USD.
    ai_context:
      synonyms:
      - closed won
      - bookings
  - name: active_headcount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN employees.employment_status = 'active' THEN 1
          END)
    description: Count of active employees.
    ai_context:
      synonyms:
      - headcount
      - active employees
      - FTEs
  - name: customer_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT CASE WHEN customers.status = 'active' THEN customers.customer_id
          END)
    description: Distinct active customers.
    ai_context:
      synonyms:
      - logos
      - active customers
  - name: avg_csat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(support_tickets.csat_score)
    description: Average customer satisfaction score on resolved support tickets.
    ai_context:
      synonyms:
      - CSAT
      - customer satisfaction
  - name: total_invoiced_usd
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(invoices.total_usd)
    description: Total amount invoiced across all invoices, USD.
