version: 0.1.1
semantic_model:
- name: acme_corp_model
  description: ACME Corp enterprise data warehouse — HR, customers, sales, products,
    billing, support, projects, vendors, and web analytics.
  ai_context:
    instructions: Use this semantic model for ACME enterprise analytics across HR,
      sales, customer success, finance, and support. Time-based analysis pivots on
      hire_date, close_date, issue_date, paid_at, and event_at. Revenue lives in subscriptions
      (recurring) and orders (one-time); see metrics for canonical definitions.
  datasets:
  - name: offices
    source: acme_warehouse.acme_corp.offices
    primary_key: [office_id]
    description: Physical ACME offices worldwide. One row per office location.
    ai_context:
      synonyms:
      - locations
      - sites
      - branches
    fields:
    - name: office_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: office_id
      description: Unique office identifier.
    - name: name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: name
    - name: country
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: country
    - name: city
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: city
    - name: address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: address
    - name: timezone
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: timezone
    - name: headcount_capacity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: headcount_capacity
    - name: opened_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: opened_date
      dimension:
        is_time: true
    - name: is_hq
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: is_hq
    - name: created_at
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: created_at
      dimension:
        is_time: true
  - name: departments
    source: acme_warehouse.acme_corp.departments
    primary_key: [department_id]
    description: Organizational departments. Self-referencing via parent_department_id.
    ai_context:
      synonyms:
      - org units
      - divisions
    fields:
    - name: department_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: department_id
    - name: name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: name
    - name: cost_center
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cost_center
