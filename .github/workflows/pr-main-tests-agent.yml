name: Run Agent Unit Tests

on:
  pull_request:
    branches:
      - main
      - Enterprise-Knowledge-Layer

permissions:
  contents: read

jobs:
  test:
    name: Agent Unit Tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --group agent

      - name: Run agent unit tests
        env:
          OPENAI_API_KEY: dummy
        run: make test-agent
