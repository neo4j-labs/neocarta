name: Run Unit, Integration, and Smoke Tests

on:
  pull_request:
    branches:
      - main
      - Enterprise-Knowledge-Layer

permissions:
  contents: read

jobs:
  test:
    name: Unit, Integration, and Smoke Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --extra cli --extra databricks --extra snowflake
      
      - name: Run format
        run: make fmt

      - name: Run lint
        run: make lint

      - name: Run core unit tests
        run: make test-unit

      - name: Run CLI unit tests
        run: make test-cli

      - name: Run integration tests
        run: make test-it

  smoke-no-extras:
    name: Smoke Tests (no optional connector extras)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately WITHOUT --extra databricks / --extra snowflake: the smoke tests assert
      # the package (and every connector) imports cleanly when the optional connector extras
      # are absent. Installing an extra here would mask an accidental top-level
      # `import snowflake.connector` that breaks neocarta[cli] users who don't install it.
      - name: Install dependencies (no connector extras)
        run: uv sync --dev --extra cli

      - name: Run smoke tests
        run: make test-smoke

  coverage:
    name: Coverage + test-count regression gate (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Full install: this is the env the #288 coverage floors were measured under
      # (coverage-baseline.md -> Reproduce), so the gate compares apples-to-apples, and
      # it makes the whole tests/ tree importable for the full-suite collection count.
      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Measure coverage (make test-cov -> coverage.xml + .coverage)
        run: make test-cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

      # The gate: fail if total/per-package coverage drops below the #288 floors or the
      # full tests/ collected count shrinks. Names the offending metric. (S0-4 / #290)
      - name: Enforce coverage + test-count regression gate (#290)
        run: make check-regression
