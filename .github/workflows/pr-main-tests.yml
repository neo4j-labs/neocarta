name: Run Unit, Integration, and Smoke Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit, Integration, and Smoke Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --group cli
      
      - name: Run format
        run: make fmt

      - name: Run lint
        run: make lint

      - name: Run core unit tests
        run: make test-unit

      - name: Run CLI unit tests
        run: make test-cli

      - name: Run integration tests
        run: make test-it
      
      - name: Run smoke tests
        run: make test-smoke
