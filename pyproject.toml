[project]
name = "neocarta"
version = "0.6.0"
description = "Library that facilitates the creation of semantic layer metadata graph in Neo4j."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Alex Gilmore" }
]
requires-python = ">=3.10"

keywords = [
    "neo4j",
    "ai",
    "llm",
    "semantic-layer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-cloud-bigquery[pandas]>=3.40.0",
    "litellm>=1.55.0",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "neo4j>=6.1.0",
    "pandas>=2.0.0,<3",
    "google-cloud-dataplex>=2.16.0",
    "sqlglot>=28.10.1",
    "google-cloud-bigquery-storage>=2.36.2",
    # Lightweight Databricks SDK — used by the Databricks connector's platform
    # helpers (workspace/secret access, identifier parsing). Pure-Python and
    # small, so it lives in the base install; the heavy Spark dependency is
    # behind the `databricks-spark` extra.
    "databricks-sdk>=0.40",
]

[project.optional-dependencies]
# Rust-accelerated Neo4j driver — 60-90% faster serialisation for bulk loads.
# Requires Python >=3.11 (compiled extension); install with: pip install neocarta[performance]
performance = [
    "neo4j-rust-ext>=6.2.0.0",
]
mcp = [
    "fastmcp>=2.14.4,<3",
    "mcp>=1.26.0",
    "pydantic-settings>=2.12.0",
]
cli = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.12.0",
]
# Spark dependencies for the Databricks connector. The connector ingests Unity
# Catalog schema via a Spark job; pyspark is the heavy dependency, so it is
# optional and only needed to actually run the connector (locally / on a
# cluster). `databricks-sdk` is already a base dependency. pydantic-settings
# backs the connector's env-driven SparkIngestSettings.
databricks-spark = [
    "pyspark>=3.5",
    "pydantic-settings>=2.12.0",
]

[project.scripts]
neocarta = "neocarta._cli:main"
neocarta-mcp = "neocarta._mcp.server:run"
# Databricks Spark ingest is a wheel-job entry point, not a CLI verb: it writes
# through the Neo4j Spark Connector and must run on a cluster. Registering it as
# a console script lets a wheel-job launcher resolve and invoke run_ingest() by
# name from the installed neocarta distribution.
neocarta-databricks-ingest = "neocarta.connectors.databricks.run:run_ingest"

[dependency-groups]
# Development tools
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "testcontainers[neo4j]>=4.14.2",
    "ruff>=0.15.10",
]

# Text2SQL agent with LangChain
agent = [
    "google-cloud-bigquery>=3.40.0",
    "langchain>=1.2.7",
    "langchain-litellm>=0.2.4",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
]
eval = [
    "fastmcp>=2.14.4",
    "mcp>=1.26.0",
    "tiktoken>=0.12.0",
]
# Spark tooling for developing/testing the Databricks connector. pyspark and
# pydantic-settings arrive via the `databricks-spark` extra; pytest runs the
# connector's local (no-cluster) Spark tests. Run with
# `uv run --group databricks ...` (see the `test-databricks` Make target).
databricks = [
    "neocarta[databricks-spark]",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neocarta"]

[tool.hatch.build.targets.sdist]
include = ["neocarta/**", "pyproject.toml", "README.md", "LICENSE"]


[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Lint target stays inferred from neocarta's requires-python (3.10) so neocarta's
# own 3.10-compatibility rules (e.g. UP017) keep firing. The ported Databricks
# connector code is 3.10-compatible (PEP 695 type-parameter syntax was removed
# during the migration), so a single lint target covers the whole tree.

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C90",     # McCabe complexity
    "COM812",  # Conflicts with the formatter
    "CPY",     # No copyright
    "D205",    # Blank line after summary — multiline summaries add clarity
    "D212",    # Conflicts with Google convention (D213)
    "D213",    # Multi-line summary on second line — dbxcarta uses first-line summaries
    "FIX002",  # Line contains TODO
    "PERF203", # Rarely useful
    "PLR09",   # Too many something (args, statements, etc.)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO

    # Intentionally lenient
    "ANN401",  # Any in type annotations
    "ARG001",  # Unused function arguments — needed for interface conformance
    "BLE",     # Blind exceptions
    "B006",    # Mutable default arguments — lists are read-only in this codebase
    "E501",    # Line too long — unavoidable in data/SQL code
    "INP001",  # Implicit namespace packages — intentional
    "PLR2004", # Magic value comparisons — too noisy in data code
    "SLF001",  # Private member access — often necessary
    "T201",    # print — will migrate to logging in a future PR
    "TID252",  # Relative imports are fine

    # Boolean handling
    "FBT001",  # Boolean type hint positional argument
    "FBT002",  # Boolean default value positional argument
    "FBT003",  # Boolean positional value in call

    # Stylistic pandas preferences — existing style is fine
    "PD003",   # .isnull() vs .isna()
    "PD011",   # .values vs .to_numpy()
    "PERF401", # Replace for loop with list comprehension — often less readable

    # Internal SQL construction, not user-facing injection risk
    "S608",    # Hardcoded SQL expression
    # Intentional silent pass (e.g. best-effort parsing)
    "S110",    # try-except-pass
    "SIM117",  # Merge nested with statements — nested is often more readable

    # Exception details
    "EM101",   # Raw string in exception
    "EM102",   # f-string in exception
    "TRY003",  # Long exception messages outside exception class
    "TRY300",  # Consider moving return to else block — reduces readability
    "TRY301",  # Abstract raise to inner function — overly pedantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is idiomatic in pytest
    "ANN",     # Type hints optional in tests
    "D",       # Docstrings optional in tests
    "N999",    # _IT suffix is a deliberate integration-test naming convention
    "PLC0415", # Lazy imports acceptable in tests
]
"eval/retrievers/bigquery_schema_retriever.py" = [
    "PLC0415", # Lazy import to avoid circular dependency with eval package
]
# Databricks example notebooks are source-format (`.py`) Databricks notebooks,
# not normal modules: `# MAGIC`/`# COMMAND` are cell markers (not dead code),
# imports live in the cell that uses them (not the file top), there is no module
# docstring, and credentials are fill-in placeholders the operator replaces.
"examples/databricks/*.py" = [
    "D100",    # Notebook source has no module docstring
    "E402",    # Cells import where used, not all at the file top
    "ERA001",  # `# MAGIC` / `# COMMAND` are Databricks notebook markers
    "S105",    # Placeholder credentials the operator fills in
]
# Ported Databricks connector + FK-enrichment source. Missing-docstring
# presence rules (D1xx) and the PySpark `functions as F` alias (N812) are
# ignored for this code, which predates neocarta's docstring gate; backfilling
# docstrings is tracked separately, not part of the migration. Scoping these
# per-path keeps neocarta's own docstring/naming enforcement intact. N804 is
# ignored because the Spark settings' model_validators run mode="after"
# (instance methods taking `self`), but neocarta's repo-wide
# classmethod-decorators lists model_validator, so ruff would otherwise demand
# `cls`. PLC0415 allows the deliberate lazy imports of the optional Spark deps.
"neocarta/connectors/databricks/**/*.py" = [
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "N804",    # after-mode model_validator takes self, not cls (see note above)
    "N812",    # `functions as F` is the canonical PySpark import alias
    "PLC0415", # Lazy imports are intentional for optional Spark deps
]
"neocarta/enrichment/foreign_keys/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "N812",
    "PLC0415",
]
"tests/unit/connectors/databricks/**/*.py" = [
    "S101",    # assert is idiomatic in pytest
    "ANN",     # Type hints optional in tests
    "D",       # Docstrings optional in tests
    "N999",    # _IT suffix is a deliberate integration-test naming convention
    "N812",    # `functions as F` is the canonical PySpark import alias
    "PLC0415", # Lazy imports acceptable in tests
    "PT011",   # Broad pytest.raises is acceptable for fixture/contract tests
    "ARG001",  # Unused fixture/stub arguments are needed for interface conformance
    "ARG002",  # Unused method arguments on fakes/stubs
    "ARG005",  # Unused lambda arguments on stubs
    "S105",    # Hardcoded "secret" strings are test fixtures, not real secrets
    "S106",    # Hardcoded password-like kwargs are test fixtures
    "S108",    # Hardcoded /tmp paths are test fixtures
    "N802",    # Test helper naming follows fixture/test conventions
    "DTZ001",  # Naive datetimes are deliberate in deterministic test fixtures
    "ERA001",  # Commented-out code in tests is illustrative
    "RUF043",  # Unraw regex pattern in pytest.raises match is fine
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["field_validator", "model_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters
