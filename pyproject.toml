[project]
name = "neocarta"
version = "0.6.0"
description = "Library that facilitates the creation of semantic layer metadata graph in Neo4j."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Alex Gilmore" }
]
requires-python = ">=3.10"

keywords = [
    "neo4j",
    "ai",
    "llm",
    "semantic-layer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-cloud-bigquery[pandas]>=3.40.0",
    "litellm>=1.55.0",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "neo4j>=6.1.0",
    "pandas>=2.0.0,<3",
    "google-cloud-dataplex>=2.16.0",
    "sqlglot>=28.10.1",
    "google-cloud-bigquery-storage>=2.36.2",
]

[project.optional-dependencies]
# Rust-accelerated Neo4j driver — 60-90% faster serialisation for bulk loads.
# Requires Python >=3.11 (compiled extension); install with: pip install neocarta[performance]
performance = [
    "neo4j-rust-ext>=6.2.0.0",
]
mcp = [
    "fastmcp>=2.14.4,<3",
    "mcp>=1.26.0",
    "pydantic-settings>=2.12.0",
]
cli = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.12.0",
]
# Databricks semantic-layer capability, published one-to-one with the dbxcarta
# distributions. `dbxcarta-core` is the light, Spark-free shared base;
# `dbxcarta-spark` is the full builder and pulls core in transitively. Both
# require Python >=3.12, so they only resolve on a 3.12+ interpreter even though
# the base `neocarta` wheel still supports 3.10.
dbxcarta-core = [
    "dbxcarta-core",
]
dbxcarta-spark = [
    "dbxcarta-spark",
]

[project.scripts]
neocarta = "neocarta._cli:main"
neocarta-mcp = "neocarta._mcp.server:run"

[dependency-groups]
# Development tools
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "testcontainers[neo4j]>=4.14.2",
    "ruff>=0.15.10",
]

# Text2SQL agent with LangChain
agent = [
    "google-cloud-bigquery>=3.40.0",
    "langchain>=1.2.7",
    "langchain-litellm>=0.2.4",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
]
eval = [
    "fastmcp>=2.14.4",
    "mcp>=1.26.0",
    "tiktoken>=0.12.0",
]
# Dev/test/type tooling for the dbxcarta directory. Installs every dbxcarta
# workspace package (so the suite can import core, spark, client, submit,
# materialize, and the example presets) plus the test/type tooling. pyspark and
# neo4j arrive transitively via dbxcarta-spark / dbxcarta-client[graph], so they
# land only in this group and never in a base `uv sync`. Run with
# `uv run --group dbxcarta ...` (see the dbxcarta-* Make targets).
dbxcarta = [
    "dbxcarta-core",
    "dbxcarta-spark",
    "dbxcarta-client[graph]",
    "dbxcarta-submit",
    "dbxcarta-materialize",
    "dbxcarta-dense-schema-example",
    "dbxcarta-finance-genie-example",
    "dbxcarta-schemapile-example",
    "pytest",
    "mypy",
    "types-requests",
]

[tool.uv.workspace]
members = [
    "dbxcarta/dbxcarta-client",
    "dbxcarta/dbxcarta-core",
    "dbxcarta/dbxcarta-materialize",
    "dbxcarta/dbxcarta-spark",
    "dbxcarta/dbxcarta-submit",
    "dbxcarta/examples/dense-schema",
    "dbxcarta/examples/finance-genie",
    "dbxcarta/examples/schemapile",
]

[tool.uv.sources]
dbxcarta-client = { workspace = true }
dbxcarta-core = { workspace = true }
dbxcarta-materialize = { workspace = true }
dbxcarta-spark = { workspace = true }
dbxcarta-submit = { workspace = true }
dbxcarta-dense-schema-example = { workspace = true }
dbxcarta-finance-genie-example = { workspace = true }
dbxcarta-schemapile-example = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neocarta"]

[tool.hatch.build.targets.sdist]
include = ["neocarta/**", "pyproject.toml", "README.md", "LICENSE"]


[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Lint target stays inferred from neocarta's requires-python (3.10) so neocarta's
# own 3.10-compatibility rules (e.g. UP017) keep firing. The dbxcarta directory
# needs 3.12 parsing (PEP 695 type parameters); it gets that from a nested
# `dbxcarta/ruff.toml` that extends this config and only overrides target-version.

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C90",     # McCabe complexity
    "COM812",  # Conflicts with the formatter
    "CPY",     # No copyright
    "D205",    # Blank line after summary — multiline summaries add clarity
    "D212",    # Conflicts with Google convention (D213)
    "D213",    # Multi-line summary on second line — dbxcarta uses first-line summaries
    "FIX002",  # Line contains TODO
    "PERF203", # Rarely useful
    "PLR09",   # Too many something (args, statements, etc.)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO

    # Intentionally lenient
    "ANN401",  # Any in type annotations
    "ARG001",  # Unused function arguments — needed for interface conformance
    "BLE",     # Blind exceptions
    "B006",    # Mutable default arguments — lists are read-only in this codebase
    "E501",    # Line too long — unavoidable in data/SQL code
    "INP001",  # Implicit namespace packages — intentional
    "PLR2004", # Magic value comparisons — too noisy in data code
    "SLF001",  # Private member access — often necessary
    "T201",    # print — will migrate to logging in a future PR
    "TID252",  # Relative imports are fine

    # Boolean handling
    "FBT001",  # Boolean type hint positional argument
    "FBT002",  # Boolean default value positional argument
    "FBT003",  # Boolean positional value in call

    # Stylistic pandas preferences — existing style is fine
    "PD003",   # .isnull() vs .isna()
    "PD011",   # .values vs .to_numpy()
    "PERF401", # Replace for loop with list comprehension — often less readable

    # Internal SQL construction, not user-facing injection risk
    "S608",    # Hardcoded SQL expression
    # Intentional silent pass (e.g. best-effort parsing)
    "S110",    # try-except-pass
    "SIM117",  # Merge nested with statements — nested is often more readable

    # Exception details
    "EM101",   # Raw string in exception
    "EM102",   # f-string in exception
    "TRY003",  # Long exception messages outside exception class
    "TRY300",  # Consider moving return to else block — reduces readability
    "TRY301",  # Abstract raise to inner function — overly pedantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is idiomatic in pytest
    "ANN",     # Type hints optional in tests
    "D",       # Docstrings optional in tests
    "N999",    # _IT suffix is a deliberate integration-test naming convention
    "PLC0415", # Lazy imports acceptable in tests
]
"eval/retrievers/bigquery_schema_retriever.py" = [
    "PLC0415", # Lazy import to avoid circular dependency with eval package
]
# dbxcarta directory. Missing-docstring presence rules (D1xx) and the PySpark
# `functions as F` alias (N812) are ignored only for dbxcarta source, examples,
# scripts, and tests. dbxcarta source predates neocarta's docstring gate;
# backfilling docstrings is tracked separately, not part of the migration.
# Scoping these per-path keeps neocarta's own docstring/naming enforcement intact.
# N804 is ignored because dbxcarta's model_validators run mode="after" (instance
# methods taking `self`), but neocarta's repo-wide classmethod-decorators lists
# model_validator (it uses before-mode), so ruff would otherwise demand `cls`.
"dbxcarta/**/src/**/*.py" = [
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "N804",    # after-mode model_validator takes self, not cls (see note above)
    "N812",    # `functions as F` is the canonical PySpark import alias
    "PLC0415", # Lazy imports are intentional for optional Spark deps
]
"dbxcarta/examples/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "N804",
    "N812",
    "PLC0415",
    "B007",    # Unused loop control variables are intentional in example walks
    "S311",    # random is used for sampling/demo data, not for crypto
    "S603",    # subprocess calls run trusted, fixed example commands
]
"dbxcarta/scripts/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "N812",
    "PLC0415",
    "ANN",     # Type hints optional in developer/CI scripts
    "S603",    # subprocess calls run trusted, fixed dev/CI commands
    "S607",    # Partial executable paths are fine for dev/CI tooling
    "PLW1510", # subprocess.run without check= is intentional (returncode inspected)
]
"dbxcarta/tests/**/*.py" = [
    "S101",    # assert is idiomatic in pytest
    "ANN",     # Type hints optional in tests
    "D",       # Docstrings optional in tests
    "N999",    # _IT suffix is a deliberate integration-test naming convention
    "N812",    # `functions as F` is the canonical PySpark import alias
    "PLC0415", # Lazy imports acceptable in tests
    "PT011",   # Broad pytest.raises is acceptable for fixture/contract tests
    "ARG001",  # Unused fixture/stub arguments are needed for interface conformance
    "ARG002",  # Unused method arguments on fakes/stubs
    "ARG005",  # Unused lambda arguments on stubs
    "S105",    # Hardcoded "secret" strings are test fixtures, not real secrets
    "S106",    # Hardcoded password-like kwargs are test fixtures
    "S108",    # Hardcoded /tmp paths are test fixtures
    "S603",    # subprocess calls in tests run trusted, fixed commands
    "S607",    # invoking trusted CLI tools (uv) by name is fine in tests
    "N802",    # Test helper naming follows fixture/test conventions
    "DTZ001",  # Naive datetimes are deliberate in deterministic test fixtures
    "ERA001",  # Commented-out code in tests is illustrative
    "RUF043",  # Unraw regex pattern in pytest.raises match is fine
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["field_validator", "model_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

# Strict mypy settings carried over from dbxcarta. Enforcement is scoped to the
# dbxcarta packages via the `dbxcarta-typecheck` Make target
# (`mypy -p dbxcarta.core -p dbxcarta.spark -p dbxcarta.client -p dbxcarta.submit
# -p dbxcarta.materialize`); neocarta's own packages opt in later, package by package.
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
strict_equality = true
